services:

  grafana-lgtm:
    image: grafana/otel-lgtm:0.38.0
    init: true
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - ENABLE_LOGS_OTELCOL=true
      - ENABLE_LOGS_TEMPO=true
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:12345:4317"
