# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: enduro
before:
  hooks:
    - make frontend
release:
  draft: true
  prerelease: auto
  github:
    owner: artefactual-labs
    name: enduro
  footer: |
    ## Docker image

    The image supports Linux AMD64 and ARM64:

    ```sh
    docker pull ghcr.io/artefactual-labs/enduro:{{ .Tag }}
    ```
changelog:
  use: github
  abbrev: 8
  groups: []
  filters:
    exclude:
      - "^docs:"
      - "^website:"
builds:
  - &linux-build
    id: enduro-linux-amd64
    binary: enduro
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -extldflags="-static"
      - -X "main.buildTime={{.Date}}"
      - -X "main.gitCommit={{.Commit}}"
      - -X "main.version={{.Version}}"
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
  # Build ARM64 for the container without adding a new release archive.
  - <<: *linux-build
    id: enduro-linux-arm64
    goarch: [arm64]
archives:
  - ids: [enduro-linux-amd64]
    wrap_in_directory: true
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}-
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - enduro.toml
      - internal/db/migrations/*.sql
dockers_v2:
  - ids: [enduro-linux-amd64, enduro-linux-arm64]
    extra_files:
      - LICENSE
    images:
      - ghcr.io/artefactual-labs/enduro
    tags:
      - "{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Env.CANDIDATE_TAG }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Legacy Enduro
      org.opencontainers.image.source: https://github.com/artefactual-labs/enduro
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    annotations:
      # Snapshots are single-platform exports and have no index to annotate.
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.source": https://github.com/artefactual-labs/enduro
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.version": "{{ .Version }}"
checksum:
  name_template: checksums.txt
  algorithm: sha256
