name: Container acceptance

on:
  workflow_call:
    inputs:
      image-artifact:
        description: Workflow artifact containing exported snapshot images
        type: string
        default: ""
      image-ref:
        description: Immutable registry reference for a release candidate
        type: string
        default: ""
      image-version:
        description: Expected binary version when testing a registry image
        type: string
        default: ""
      full-tests:
        description: Include the Archivematica and storage integration suites
        type: boolean
        default: true

permissions:
  contents: read
  packages: read # Pull release candidates from GitHub Container Registry.

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    name: ${{ matrix.arch }} ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        suite: ${{ fromJSON(inputs.full-tests && '["startup-test", "smoke-tests", "minio-latest", "seaweedfs", "argmin"]' || '["startup-test"]') }}
        exclude:
          - arch: arm64
            suite: minio-latest
          - arch: arm64
            suite: smoke-tests
          - arch: arm64
            suite: seaweedfs
          - arch: arm64
            suite: argmin
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REF: ${{ inputs.image-ref }}
      IMAGE_VERSION: ${{ inputs.image-version }}
      IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
      ARCH: ${{ matrix.arch }}
      SUITE: ${{ contains(fromJSON('["minio-latest", "seaweedfs", "argmin"]'), matrix.suite) && 'object-storage-smoke-test' || matrix.suite }}
      PROVIDER: ${{ contains(fromJSON('["minio-latest", "seaweedfs", "argmin"]'), matrix.suite) && matrix.suite || '' }}
      DAGGER_NO_NAG: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate image input
        shell: bash
        run: |
          if [[ -n $IMAGE_REF && -z $IMAGE_ARTIFACT && -n $IMAGE_VERSION ]]; then
            [[ $IMAGE_REF =~ ^ghcr.io/artefactual-labs/enduro@sha256:[a-f0-9]{64}$ ]]
          elif [[ -n $IMAGE_ARTIFACT && -z $IMAGE_REF ]]; then
            :
          else
            echo "Provide either an image artifact or an immutable image reference and version" >&2
            exit 1
          fi
      - name: Download container images
        if: ${{ inputs.image-artifact != '' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.image-artifact }}
          path: dist/containers
      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@v5.6.0
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.image-ref != '' }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check native image configuration and entrypoint
        shell: bash
        run: |
          if [[ -n $IMAGE_REF ]]; then
            ./hack/containers/smoke.sh --image-ref "$IMAGE_REF" --arch "$ARCH" \
              --commit "$(git rev-parse HEAD)" --version "$IMAGE_VERSION"
          else
            ./hack/containers/smoke.sh "$ARCH" dist/containers
          fi
      - name: Configure Dagger engine cache
        run: |
          mkdir -p "$HOME/.config/dagger"
          cat > "$HOME/.config/dagger/engine.json" <<'JSON'
          {
            "gc": {
              "maxUsedSpace": "30%",
              "reservedSpace": "5%",
              "minFreeSpace": "30%",
              "sweepSize": "50%"
            }
          }
          JSON
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "1.0.0-beta.24"
      - name: Test the built image
        shell: bash
        run: |
          image_args=(--image-archive "dist/containers/enduro-$ARCH.tar")
          if [[ -n $IMAGE_REF ]]; then
            image_args=(--image-ref "$IMAGE_REF")
          fi
          provider_args=()
          if [[ -n $PROVIDER ]]; then
            provider_args=(--provider "$PROVIDER")
          fi
          mkdir -p hack/dagger/runtime/acceptance
          hack/dagger/run.sh "$SUITE" hack/dagger/runtime/acceptance/results \
            "${image_args[@]}" "${provider_args[@]}" \
            2>&1 | tee hack/dagger/runtime/acceptance/dagger.log
      - name: Retain acceptance results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: container-${{ matrix.arch }}-${{ matrix.suite }}
          path: hack/dagger/runtime/acceptance/
          if-no-files-found: warn
          retention-days: 7
