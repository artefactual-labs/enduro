name: Check SBOM inventory

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sbom-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Build and verify complete inventory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the pull-request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Capture source inputs
        run: |
          mkdir -p sbom-evidence
          go list -m -json all > sbom-evidence/go-modules.json
          cp go.mod go.sum frontend/package.json frontend/package-lock.json sbom-evidence/
      - name: Install shared reporting tool
        id: reporting
        uses: artefactual-labs/sbom-reporting@7bedac9ed66d6ec7c03e48faf1796c472f1d984f # v0.2.1
      - name: Build the archive with frontend evidence
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --snapshot
        env:
          SBOM_FRONTEND_PLUGIN: ${{ steps.reporting.outputs.frontend-plugin }}
          SBOM_FRONTEND_EVIDENCE: ${{ github.workspace }}/sbom-evidence/frontend-build.json
      - name: Collect, merge, and verify without uploading
        env:
          # These are local validation identities, never a published main report.
          DEPENDENCY_TRACK_PARENT_UUID: 11111111-1111-4111-8111-111111111111
          REPORT_VERSION: main
          REPORT_COMMIT: ${{ github.sha }}
          REPORT_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          REPORT_TOOL_REVISION: ${{ steps.reporting.outputs.revision }}
        run: |
          printf '%s\n' "$REPORT_TOOL_REVISION" > sbom-evidence/reporting-tool-revision.txt
          sbom-reporting collect-goreleaser sbom.toml \
            --version "$REPORT_VERSION" --commit "$REPORT_COMMIT" --run "$REPORT_RUN"
          sbom-reporting merge sbom-evidence/manifest.json --output sbom-evidence/snapshot
          sbom-reporting verify sbom-evidence/snapshot
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-check-${{ github.run_attempt }}
          path: sbom-evidence/
          if-no-files-found: warn
          retention-days: 7
