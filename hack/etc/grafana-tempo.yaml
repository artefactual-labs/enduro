server:
  http_listen_port: 3200
  graceful_shutdown_timeout: "1s"

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
  log_received_spans:
    enabled: true
    include_all_attributes: true

storage:
  trace:
    backend: "local"
    wal:
      path: "/var/tempo/wal"
    local:
      path: "/var/tempo/blocks"
